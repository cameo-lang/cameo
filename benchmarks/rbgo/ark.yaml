# ark part manifest — see /docs/component-manifest.md
name: rbgo
kind: part
lang: golang
description: >
  rbgo: a command that runs a Ruby script on go-embedded-ruby, a Ruby
  interpreter written in Go, through its embedding API. cameo's benchmarks
  compare against it. go-embedded-ruby needs Go 1.27.2, so this module is
  kept out of the go.work workspace and built on its own (GOWORK=off).
license: BSD-3-Clause

# In-ark dependencies, by absolute path within ark.
deps: []

export:
  repo: ""   # a benchmark tool, not released
