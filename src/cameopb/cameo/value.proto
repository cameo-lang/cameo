// The envelope: cameo.Value carries any value that can be serialised. It
// is what async serialises, what the host API takes and returns, and what a
// dump holds. doc/design/cameo.md, "Protobuf", describes it.
syntax = "proto3";

package cameo;

option go_package = "github.com/cameo-lang/cameo/src/cameopb";

import "cameo/ir.proto";

// Value is one value. With no kind set it is nil. A symbol travels as a
// string, and an integer beyond 64 bits as big_value, its decimal digits.
message Value {
  oneof kind {
    bool bool_value = 1;
    int64 int_value = 2;
    double float_value = 3;
    string string_value = 4;
    bytes bytes_value = 5;
    List list = 6;
    Map map = 7;
    Set set = 8;
    Range range = 9;
    Object object = 10;
    Time time = 11;
    Regexp regexp = 12;
    string big_value = 13;
    Closure closure = 14;
    // symbol_value is a Symbol, in a dump alone: a run resumes with the
    // values it had. In every other message a symbol is a string_value,
    // and reads back as a String.
    string symbol_value = 15;
    // handle is a library's value that changes, a StringIO, in a dump
    // alone: its index among the dump's handles, plus one. No other
    // message carries a handle.
    uint32 handle = 16;
  }
}

// Closure is a Proc: a block or a lambda a script wrote, as the proc of a
// unit it runs and the binding it runs in; or a proc made from a symbol.
message Closure {
  // unit is the digest of the unit, proc the index of the proc in it.
  string unit = 1;
  uint32 proc = 2;
  // code is the unit itself, on the first closure of a message that
  // refers to it; a reader keeps it for the closures that follow.
  Unit code = 3;
  Binding binding = 4;
  // strict is set for a lambda: its arguments are counted, and its return
  // returns from it.
  bool strict = 5;
  // self_name is the local of the binding that holds the closure itself:
  // a lambda that calls itself by the name it is assigned to.
  string self_name = 6;
  // symbol is set for a proc made from a symbol, `&:name`, which calls
  // that method on its first argument; with recv set, on recv, as the
  // proc of a Hash calls []. Such a proc has no unit and no binding.
  string symbol = 7;
  Value recv = 8;
  // frame is set in the dump of a run that paused inside a statement, for
  // a proc written in a frame whose call was running: the index of that
  // frame among the dump's frames, plus one. The binding then holds the
  // locals alone, and the proc's return, yield and super are that
  // frame's after the resume.
  uint32 frame = 9;
}

// Binding is what a closure's code runs in: the locals it reads, by
// value, and the frame it was written in.
message Binding {
  // Local is one variable: its value, or the class it names.
  message Local {
    string name = 1;
    Value value = 2;
    string class = 3;
  }
  // Method names the method the closure was written in, which a super
  // inside it continues from: the class that defines it by its qualified
  // name, "" for the top level, and whether it is a class method.
  message Method {
    string owner = 1;
    string name = 2;
    bool singleton = 3;
  }
  repeated Local locals = 1;
  // self is the receiver: a value, a class by its qualified name, or
  // neither for the top-level self.
  Value self = 2;
  string self_class = 3;
  Method method = 4;
  // lexical is the chain of classes and modules around the code,
  // innermost last, by qualified name; def_target the class a def inside
  // the closure defines on, "" for the top level.
  repeated string lexical = 5;
  string def_target = 6;
  // file is the library the code is from, "" for the script.
  string file = 7;
  // args, kw and block are those of the call of the method the closure
  // was written in, carried when the closure's code has a bare super or a
  // yield, which use them.
  repeated Value args = 8;
  Map kw = 9;
  Value block = 10;
}

message List {
  repeated Value items = 1;
}

message Set {
  repeated Value items = 1;
}

// Map is a Hash: its entries in order, and its default when it has one, a
// value or a proc that computes it.
message Map {
  message Entry {
    Value key = 1;
    Value value = 2;
  }
  repeated Entry entries = 1;
  Value default = 2;
  Closure default_proc = 3;
}

message Range {
  Value lo = 1;
  Value hi = 2;
  bool exclusive = 3;
}

// Object is an instance or an exception: its class by qualified name and
// digest, and the wire form of the class's own message.
message Object {
  string class = 1;
  string digest = 2;
  bytes message = 3;
}

// Time is an instant, its UTC offset in seconds, and its zone: "UTC",
// "local", the IANA name of a named zone, or none for a fixed offset.
message Time {
  int64 seconds = 1;
  int32 nanos = 2;
  int32 offset = 3;
  string zone = 4;
}

message Regexp {
  string source = 1;
  int32 options = 2;
}
