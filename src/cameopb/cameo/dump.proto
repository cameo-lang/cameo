// A dump is a paused run, as `cameo` writes it on ^C and `cameo resume`
// reads it back. doc/design/pause.md describes what it holds.
syntax = "proto3";

package cameo;

option go_package = "github.com/cameo-lang/cameo/src/cameopb";

import "cameo/ir.proto";
import "cameo/value.proto";

// Dump is a paused run: the script, where it paused, and what its top
// level held.
message Dump {
  // Binding is one variable or constant. value is its value, set also for
  // nil; a class is referred to in class instead, as Class describes, and
  // the top-level self is marked with main; a value the envelope cannot
  // carry has none of them, and missing says what it was.
  message Binding {
    string name = 1;
    Value value = 2;
    string class = 3;
    string missing = 4;
    bool main = 5;
    // building marks the instance an initialize is filling: the frame
    // of that initialize, plus one. The instance changes until its
    // initialize ends, so the dump holds it once, in the frame, and
    // what else holds it refers to it there.
    uint32 building = 6;
  }

  // Promise is a settled promise: its result in value, or the exception it
  // failed with in failure, and in value too when the envelope carries it.
  message Promise {
    int64 id = 1;
    // method is the method async ran; none for a promise made by hand.
    string method = 2;
    Value value = 3;
    Failure failure = 4;
    // awaited is set when the script awaited the promise before the pause.
    bool awaited = 5;
  }

  // Failure is the exception a promise failed with.
  message Failure {
    string class = 1;
    string message = 2;
    int32 line = 3;
  }

  // file and source are the script: its path and its text.
  string file = 1;
  string source = 2;
  // next is the index of the top-level statement the run continues with,
  // line its line.
  int32 next = 3;
  int32 line = 4;
  repeated Binding variables = 5;
  // constants are the constants of the top level: the ones the script
  // assigned, and its classes and modules, each a reference to a class of
  // classes.
  repeated Binding constants = 6;
  repeated Promise promises = 7;
  // loaded names the libraries require loaded.
  repeated string loaded = 8;
  // rand is the state of the random number generator.
  bytes rand = 9;
  // at_exit are the blocks at_exit registered, in the order they were
  // registered; a binding without a name.
  repeated Binding at_exit = 10;

  // version is the IR version of the dump's code; a cameo resumes a dump
  // of the version it runs.
  uint32 version = 11;
  // units are the units of code the run had: the script's, and those of
  // the libraries written in cameo it required. Methods and closures name
  // their code in them, by digest.
  repeated Unit units = 12;
  // classes are the classes and modules the script defined, and the ones
  // it holds a copy of because a library written in cameo added to them.
  // The methods of the top level are in top.
  repeated Class classes = 13;
  // cameo_top is set when the script included Cameo at the top level.
  bool cameo_top = 14;
  Class top = 15;
  // missing says what of the classes and of the stack the dump leaves
  // out, one entry for each: a constant, an attribute, a local or a value
  // in flight that the envelope cannot carry, as a Binding's missing says
  // for a variable.
  repeated string missing = 16;

  // stack is the activations the script was running when it paused
  // inside a statement, the outermost first: the statement next names,
  // then the calls in flight. It is empty for a run that paused between
  // two statements. scopes and frames are what the activations run in;
  // an activation, a scope and a closure refer to one by its index, plus
  // one where zero says none.
  repeated Activation stack = 17;
  repeated Scope scopes = 18;
  repeated Frame frames = 19;

  // Activation is one running proc: where it is, and what it holds.
  message Activation {
    enum Kind {
      // STATEMENT is the top-level statement the run paused in.
      STATEMENT = 0;
      // METHOD is a call of a method, BLOCK of a block.
      METHOD = 1;
      BLOCK = 2;
      // BUILTIN is a call of a builtin that is a stepper, which is
      // between two calls of its block: the activation above it. It has
      // builtin, and no code, scope or frame.
      BUILTIN = 3;
    }
    Kind kind = 1;
    // unit and proc name the code of a method or a block, as a Closure
    // names its code.
    string unit = 2;
    uint32 proc = 3;
    // cursors are the lists the activation is inside, the outermost
    // first: the proc's own list, then the list of an instruction of
    // the list before.
    repeated Cursor cursors = 4;
    // stack is the value stack: the operands of the expressions in
    // flight.
    repeated Binding stack = 5;
    // scope and frame are indexes into scopes and frames.
    uint32 scope = 6;
    uint32 frame = 7;
    // line is the line of the activation's next instruction.
    int32 line = 8;
    Builtin builtin = 9;
    // block is the proc of a BLOCK that was called as a value, with
    // call. One the activation below yielded to has none: it is the
    // block of that activation's frame, or of its builtin.
    Binding block = 10;
    // result is what the caller gets in place of the activation's own
    // value: the instance new made, for an initialize.
    Binding result = 11;
  }

  // Builtin is a builtin that calls its block, between two of the calls:
  // the method, the call it was made with, and what it keeps from one
  // call of the block to the next (object.Stepper).
  message Builtin {
    // method names the builtin by the class that defines it.
    .cameo.Binding.Method method = 1;
    Binding self = 2;
    repeated Binding args = 3;
    Value kw = 4;
    Binding block = 5;
    repeated Binding state = 6;
    // rescue is set when the builtin takes an exception its block
    // raises.
    bool rescue = 7;
  }

  // Cursor is a list of instructions an activation is inside. The list
  // is one of the instruction the cursor before it ran last; the first
  // cursor's is the proc's.
  message Cursor {
    // next is the index of the next instruction, list which list of its
    // instruction this is, and phase what the instruction does when the
    // list ends (eval/cursor.go).
    uint32 next = 1;
    uint32 list = 2;
    uint32 phase = 3;
    // base is the height of the value stack when the instruction
    // started.
    uint32 base = 4;
    // statement is set when the next instruction starts a statement.
    bool statement = 5;
    // rescuing is, for a BEGIN, the exception its rescue clauses are
    // tried for or one of them is handling; pending what its ensure
    // clause interrupted.
    Value rescuing = 6;
    Completion pending = 7;
  }

  // Completion is what left a list early.
  message Completion {
    enum Kind {
      EXCEPTION = 0;
      BREAK = 1;
      NEXT = 2;
      RETURN = 3;
      RETRY = 4;
      REDO = 5;
    }
    Kind kind = 1;
    // value is what a break, a next or a return carries; exception the
    // exception.
    Binding value = 2;
    Value exception = 3;
    int32 line = 4;
    // target is the frame a return returns from, or the frame whose
    // block a break left, plus one; zero for none.
    uint32 target = 5;
  }

  // Scope is the local variables of an activation. A block's scope has
  // the values the block captured as its parent.
  message Scope {
    // top marks the top level's scope, whose variables are the dump's
    // variables.
    bool top = 1;
    repeated Binding locals = 2;
    // parent is the scope around, plus one.
    uint32 parent = 3;
    // captured marks the values a block captured, and origin is the
    // scope of the method the block was written in, plus one.
    bool captured = 4;
    uint32 origin = 5;
    // promises are the ids of the promises async started in the scope.
    repeated int64 promises = 6;
  }

  // Frame is what a method call runs in, and every block written in it:
  // self, the method, its arguments and block, the classes around.
  message Frame {
    // top marks the frame of the top level.
    bool top = 1;
    Binding self = 2;
    // method is the method, by the class that defines it, "" for the
    // top level; none for a frame of the top level or a class body.
    .cameo.Binding.Method method = 3;
    reserved 4;
    repeated Binding args = 5;
    Value kw = 6;
    Binding block = 7;
    // lexical are the classes and modules around the code, innermost
    // last; def_target the class a def in the frame defines on, "" for
    // the top level.
    repeated string lexical = 8;
    string def_target = 9;
    string file = 10;
    // lambda marks the frame of a lambda's call; ended a frame whose
    // call returned, which a block written in it outlived.
    bool lambda = 11;
    bool ended = 12;
    // building is the instance the frame's initialize is filling. An
    // initialize that a super in another initialize called fills the
    // same instance, and names that frame, plus one, in building_of.
    Value building = 13;
    uint32 building_of = 14;
  }

  // Class is a class or a module as the run had made it.
  //
  // A class is referred to by a string, here and in a Binding: the id of
  // a class of the dump; or the qualified name of a class the dump does
  // not carry, which Go defined or the host registered, with "::" in
  // front when a constant of the script hides that name.
  message Class {
    // id is the qualified name, Geo::Point, for the class that name is
    // bound to. A class that is no longer bound to its name, since the
    // script reopened it, which makes a new class, or one that never had
    // a name, has its digest after an @, and a number where two would
    // have the same.
    string id = 14;
    // name is the qualified name, "" for a class Class.new made that no
    // constant names yet; lexical the class or module it is defined in.
    string name = 1;
    string lexical = 15;
    bool module = 2;
    // super is the superclass, "" for a module.
    string super = 3;
    string digest = 4;
    // includes and extends are the modules included and extended, in
    // order.
    repeated string includes = 5;
    repeated string extends = 6;
    // fields are the class's fields in order, the inherited ones too.
    repeated Field fields = 7;
    repeated int64 reserved_numbers = 8;
    repeated string reserved_names = 9;
    repeated Method methods = 10;
    // consts are the constants of the class's body, the classes and
    // modules defined in it among them.
    repeated Binding consts = 11;
    // attrs are the values of the class's attributes; attr_defaults the
    // defaults of the ones it declared itself.
    repeated Binding attrs = 12;
    repeated Binding attr_defaults = 13;
    // A copy of a class or module Go defined, which has a digest that
    // starts with +, lists what it has beyond the one Go defined: the
    // modules, fields and methods added to it, and all of its constants.
  }

  // Field is one field of a class. owner is the class that declared it:
  // the class itself, or an ancestor.
  message Field {
    string name = 1;
    int64 number = 2;
    FieldType type = 3;
    Value default = 4;
    string owner = 5;
  }

  // FieldType is the declared type of a field: kind is a scalar type's
  // name, or list, set, map, ref, enum, proc.
  message FieldType {
    string kind = 1;
    // elem is the element of a list or set and the value of a map; key
    // the scalar type of a map's keys.
    FieldType elem = 2;
    string key = 3;
    // ref is the class of a ref field; enum the symbols of an enum field.
    string ref = 4;
    repeated string enum = 5;
    string named = 6;
  }

  // Method is a method a script defined: its code as the proc of a unit.
  // owner is the class that defines it, when it is not the class that
  // lists it: an alias gives a class a method of an ancestor under
  // another name. lexical are the classes and modules around its
  // definition, innermost last; file is the library it is from, "" for
  // the script.
  //
  // A method Go implements has no code to carry. One a script gave
  // another name with alias is listed with alias_of, the name it has in
  // owner, and no unit.
  message Method {
    string name = 1;
    bool singleton = 2;
    string unit = 3;
    uint32 proc = 4;
    repeated string lexical = 5;
    string file = 6;
    string owner = 7;
    string alias_of = 8;
  }
}
