rm="translate(35 115) rotate(0 171.60000000000002 40)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">eval(node):</text><text x="0" y="34.096000000000004" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  switch node.(type) { ... 47 cases }</text><text x="0" y="54.096000000000004" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  case *Call: eval(recv), eval(args)</text><text x="0" y="74.096" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">    then the same switch for each child</text></g><g stroke-opacity="0.6" fill-opacity="0.6" stroke-linecap="round" transform="translate(420 70) rotate(0 180 100)"><path d="M32 0 C144.84 -5.07, 257.02 -2.34, 328 0 C352.56 -2.83, 356.65 13.86, 360 32 C359.44 78.79, 361.28 121.99, 360 168 C361.21 190.32, 347.74 203.34, 328 200 C261.21 198.23, 198.85 200.89, 32 200 C12.63 196.57, 3.24 189.24, 0 168 C-0.41 114.96, 0.63 62.25, 0 32 C-1.8 11.05, 11.33 2.91, 32 0" stroke="none" stroke-width="0" fill="#b2f2bb"></path><path d="M32 0 C91 0.89, 151.25 -0.75, 328 0 M32 0 C105.22 -0.26, 178.74 -1.02, 328 0 M328 0 C349.66 0.76, 359.91 9.31, 360 32 M328 0 C351.12 0.45, 361.79 12.45, 360 32 M360 32 C361.62 80.88, 361.68 128.32, 360 168 M360 32 C360.93 72.73, 361.67 115.83, 360 168 M360 168 C361.36 190.95, 349.69 200.52, 328 200 M360 168 C358.6 189.9, 348.56 198.09, 328 200 M328 200 C228.14 200.56, 127.04 200.69, 32 200 M328 200 C226.79 201.19, 125.21 199.86, 32 200 M32 200 C9.68 201.41, -1.58 190.08, 0 168 M32 200 C8.74 199.84, 1.04 190.2, 0 168 M0 168 C0.79 117.61, -1.38 62.54, 0 32 M0 168 C-0.53 128.6, -1.56 89.68, 0 32 M0 32 C-0.08 12.63, 8.7 0.23, 32 0 M0 32 C-0.98 10.43, 10.59 2.05, 32 0" stroke="#1e1e1e" stroke-width="2" fill="none"></path></g><g transform="translate(435 80) rotate(0 89.10000000000002 11.25)"><text x="0" y="15.858" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="18px" fill="#15803d" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">compiled (step 10)</text></g><g transform="translate(435 115) rotate(0 149.60000000000002 50)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">first visit: compile(node) builds</text><text x="0" y="34.096000000000004" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  func(in, env, fr) for it, with</text><text x="0" y="54.096000000000004" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  the children's funcs inside</text><text x="0" y="74.096" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">later visits: call the func;</text><text x="0" y="94.096" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">  no switch, no lookup of children</text></g><g transform="translate(20 295) rotate(0 286 20)"><text x="0" y="14.096" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#757575" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">The interpreter is a parameter of each func, not captured, so one</text><text x="0" y="34.096000000000004" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#757575" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">compiled program serves the script and every async worker.</text></g></svg>
