name: Pages

# Publishes the static site in doc/gh_pages to https://cameo-lang.github.io/cameo/,
# this repository's own GitHub Pages site. The repository's Pages source must
# be "GitHub Actions"; the deployment needs no token beyond the workflow's own.

on:
  push:
    branches: [main]
    paths:
      - doc/gh_pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish doc/gh_pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: doc/gh_pages

      - id: deployment
        uses: actions/deploy-pages@v4
