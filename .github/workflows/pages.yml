name: Pages

# Publishes the static site in doc/gh_pages to https://cameo-lang.github.io.
#
# GitHub serves an organisation's root site from the repository named after
# it, cameo-lang/cameo-lang.github.io, so the publish job pushes doc/gh_pages
# to that repository's main branch, which its Pages setting serves (source
# "Deploy from a branch", branch main, folder /). The push authenticates
# with the secret PAGES_TOKEN, a fine-grained personal access token with
# read and write access to that repository's contents.
#
# The redirect job keeps this repository's own Pages site, the old address
# https://cameo-lang.github.io/cameo/, forwarding every path to the new
# one. Its Pages source must be "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - doc/gh_pages/**
      - doc/pages_redirect/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish doc/gh_pages to cameo-lang.github.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Push the site
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          SITE_REPOSITORY: cameo-lang/cameo-lang.github.io
        run: |
          if [ -z "$PAGES_TOKEN" ]; then
            echo "::error::the secret PAGES_TOKEN is not set: a fine-grained token with contents read and write on $SITE_REPOSITORY"
            exit 1
          fi
          git clone --quiet --depth 1 "https://x-access-token:${PAGES_TOKEN}@github.com/${SITE_REPOSITORY}.git" site
          rsync --archive --delete --exclude .git doc/gh_pages/ site/
          touch site/.nojekyll
          cd site
          git checkout --quiet -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "the site is up to date"
            exit 0
          fi
          git commit --quiet --message "Publish doc/gh_pages from cameo-lang/cameo@${GITHUB_SHA}"
          git push --quiet origin HEAD:main

  redirect:
    name: redirect the old address
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Serve the redirect for every path
        run: cp doc/pages_redirect/index.html doc/pages_redirect/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: doc/pages_redirect

      - id: deployment
        uses: actions/deploy-pages@v4
